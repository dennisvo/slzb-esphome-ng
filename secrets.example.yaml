# Template for secrets.yaml — copy to secrets.yaml and fill in real values.
# secrets.yaml is gitignored (.gitignore line 5).
#
# Required by the slzb-esphome-ng firmware (packages/core/core.yaml).
# Requires an ESPHome dashboard / CLI on 2026.9.0 or newer — the OTA
# transport inherits this key (encrypted, no separate password).

# Per-device PSK. Protects both the Native API (port 6053) and OTA
# updates (port 3232) via Noise NNpsk0 + ChaCha20-Poly1305.
# Generate one at https://esphome.io/components/api.html (or run
# `python -c "import secrets, base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"`).
# Home Assistant stores the same value when adopting the device.
device_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY"

# Optional: Wi-Fi credentials (only if using packages/wifi/wifi.yaml
# instead of Ethernet).
# wifi_ssid: "your-ssid"
# wifi_password: "your-wifi-password"
