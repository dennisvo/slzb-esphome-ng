packages:

  ############################################################
  #  0) Hardware definition (pins, SoC/flash, naming, flags)  #
  ############################################################
  hw: !include ../hw_defs/mrxu/mr4u_r1_73.yaml


  ############################################################
  #  1) ESPHome platform / runtime services (hardware-agnostic)
  #     - core system config, diagnostics, bluetooth, etc.
  ############################################################
  platform_core: !include ../packages/core/core.yaml
  platform_diag: !include ../packages/diagnostics/diagnostics.yaml
  # BLE proxy is off by default — it shares CPU / interrupts / RF frontend
  # with the radio UART loops. Uncomment to opt in; see
  # docs/development-considerations.md §11.3.
  # platform_ble:  !include ../packages/bluetooth/bluetooth.yaml

  # --- Radio firmware version diagnostics (v1) ---
  # `radio_probe_ext` declares the custom component; the per-radio packages
  # attach probe instances + template sensors. See docs/v1-radio-firmware.md.
  platform_radio_probe_ext: !include ../packages/diagnostics/radio_probe_ext.yaml
  platform_radio1_probe:    !include ../packages/diagnostics/radio1_probe.yaml
  platform_radio2_probe:    !include ../packages/diagnostics/radio2_probe.yaml
  # NOTE (slzb-esphome-ng fork): `stream_server` and its per-UART bridges are
  # replaced by `serial_proxy` instances tunnelled through the encrypted Native
  # API. See docs/design.md §7 and Phase 1.
  # platform_wifi: !include ../packages/wifi/wifi.yaml   # enable if needed


  ############################################################
  #  2) HAL layer (hardware access / drivers / implementations)
  #     Buses + peripherals
  ############################################################

  # --- I2C Bus ---
  hal_i2c: !include ../packages/buses/i2c.yaml

  # --- UART HW flow control ext (fork-local custom component) ---
  # Declares components/uart_hw_flow/ so the uartN_hw_flow.yaml packages can
  # register per-UART flow-control instances. See docs/v1-design.md §5.
  platform_uart_hw_flow_ext: !include ../packages/buses/uarts/uart_hw_flow_ext.yaml

  # --- UART buses (with HW flow control) ---
  hal_uart1: !include ../packages/buses/uarts/uart1_hw_flow.yaml
  hal_uart2: !include ../packages/buses/uarts/uart2_hw_flow.yaml

  # --- UART reset/flash control ---
  # NOTE (slzb-esphome-ng fork): the `uart{1,2}_rst_gpio` / `uart{1,2}_flash_gpio`
  # switch-based controls are dropped on MR4U. GPIO ownership for the CC26
  # nRESET / BSL_ENTRY and EFR32 nRESET / bootloader-entry pins is transferred
  # to `serial_proxy` `dtr_pin` / `rts_pin` so ZHA / zigpy-znp / bellows can
  # drive the coordinator bootloader sequence over the encrypted API.
  # See docs/design.md Phase 1 item 5 and docs/hardware-map.md §5.

  # --- UART serial proxies (secure Native API tunnel) ---
  hal_uart1_serial_proxy: !include ../packages/serial_proxies/sp_uart1.yaml
  hal_uart2_serial_proxy: !include ../packages/serial_proxies/sp_uart2.yaml

  # --- Inputs ---
  hal_btn1: !include ../packages/input/button1_gpio.yaml
  # Note: MRxU has no Button 2

  # --- Status LEDs ---
  hal_led1: !include ../packages/leds/led1_gpio.yaml
  hal_led2: !include ../packages/leds/led2_gpio.yaml

  # --- Ethernet / W5500 / RJ45 LEDs ---
  hal_w5500:     !include ../packages/ethernet/w5500_gpio.yaml
  hal_rj45_leds: !include ../packages/ethernet/rj45_leds_gpio.yaml

  # --- USB mode ---
  hal_usb_mode:       !include ../packages/usb/usb_device_host_switch.yaml
  hal_poe_to_usb:     !include ../packages/usb/poe_to_usb_power.yaml
  hal_usbc_cc_adc:    !include ../packages/usb/usbc_cc_adc.yaml


  ############################################################
  #  3) Logic layer (behavior, scripts, automations)
  ############################################################

  # --- UART baud rate selector in runtime ---
  logic_baud_rate_selector_uart1: !include ../packages/buses/uarts/uart_baud_runtime_selector/uart1_baud_selector.yaml
  logic_baud_rate_selector_uart2: !include ../packages/buses/uarts/uart_baud_runtime_selector/uart2_baud_selector.yaml
