esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: SMLIGHT.${device_name}
    version: "1.00"

esp32:
  board: ${esp32_board}
#  flash_size: ${esp32_flash_size}
#  cpu_frequency: ${cpu_frequency}
  framework:
    type: esp-idf
#    version: recommended
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "16"

# ESP32-S3R2 with PSRAM (typical mode: quad)
psram:
  mode: ${esp32_psram_mode}
  speed: ${esp32_psram_speed}  

# INFO by default — DEBUG-level logging at the ESPHome loop level is expensive
# when the loop is also servicing `serial_proxy` bytes for the radio UARTs.
# Override in a device file (or via substitution) for dev builds.
logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

