# packages/buses/uarts/uart3_hw_flow.yaml
#
# UART3 (Radio 3, ultima-only) bus + optional hardware flow control.
#
# See uart1_hw_flow.yaml for the rationale. Prerequisites:
# `packages/buses/uarts/uart_hw_flow_ext.yaml` must be included once by
# the device before this file.
#
# See docs/v1-design.md §5.

uart:
  - id: hw_uart3
    tx_pin: ${pin_uart3_tx}
    rx_pin: ${pin_uart3_rx}
    baud_rate: ${uart3_baud}

uart_hw_flow:
  - uart_id: hw_uart3
    cts_pin: ${pin_uart3_cts}
    rts_pin: ${pin_uart3_rts}
    enabled: ${uart3_hw_flow}
