# packages/buses/uarts/uart2_hwfc.yaml
#
# UART2 (Radio 2) with optional hardware flow control.
#
# See uart1_hwfc.yaml for the rationale. Prerequisites:
# `packages/buses/uarts/uart_hw_flow_ext.yaml` must be included once by
# the device before this file.
#
# See docs/v1-design.md §5.

uart:
  - id: hw_uart2
    tx_pin: ${pin_uart2_tx}
    rx_pin: ${pin_uart2_rx}
    baud_rate: ${uart2_baud}

uart_hw_flow:
  - uart_id: hw_uart2
    cts_pin: ${pin_uart2_cts}
    rts_pin: ${pin_uart2_rts}
    enabled: ${uart2_hw_flow}
