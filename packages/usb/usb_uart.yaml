usb_host:
  enable_hubs: true
  max_transfer_requests: 32  # For high-throughput devices like USB UART at 115200+ baud

usb_uart:
  - type: cp210x
    channels:
      - id: usb_device_uart
        baud_rate: 115200
        buffer_size: 1024

# slzb-esphome-ng: replaced plaintext stream_server on port 9638 with
# serial_proxy over encrypted Native API. Consumer connects via
# esphome-hass://esphome/{entry_id}?port_name=usb — no raw UART on the LAN.
serial_proxy:
  - id: sp_usb_device
    name: "usb"
    port_type: RS232       # CP210x is a USB-serial bridge, not TTL
    uart_id: usb_device_uart
