# packages/diagnostics/radio_probe_ext.yaml
#
# Declares the `radio_probe` custom component as an external component.
#
# Include this once per device before any `packages/diagnostics/radioN_firmware_info.yaml`.
# The per-radio packages register `radio_probe:` entries but assume this
# declaration has already happened.
#
# Fetches from GitHub so ESPHome-dashboard builds (which pull YAML packages
# via `packages: url: ...`) can resolve the C++ source too. Local-clone dev
# iteration on unpushed component changes: temporarily swap `type: git` for
# `type: local, path: components`.
#
# See docs/v1-radio-firmware.md §5 for the shipping form.

external_components:
  - source:
      type: git
      url: https://github.com/dennisvo/slzb-esphome-ng
      ref: main
      path: components
    refresh: 0s
    components: [radio_probe]
