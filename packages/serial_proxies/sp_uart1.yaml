# hal/serial_proxies/sp_uart1.yaml
#
# CC26 (Zigbee) coordinator on UART1, tunnelled through the encrypted
# ESPHome Native API.
#
# dtr_pin → CC26 nRESET (active-low). zigpy-znp / universal-silabs-flasher
#           drive DTR to reset the coordinator for bootloader entry.
# rts_pin → CC26 BSL_ENTRY / boot pin (active-low). Held low during reset
#           to enter the ROM bootloader.
#
# port_name = "zigbee" — surfaced to HA's ZHA config flow port picker as
#   esphome-hass://esphome/{entry_id}?port_name=zigbee
#
# See docs/design.md Phase 1 item 5, docs/hardware-map.md §5,
# docs/serial-proxy-inspection.md §2.

serial_proxy:
  - id: sp_uart1
    name: "zigbee"
    port_type: TTL
    uart_id: hw_uart1
    dtr_pin:
      number: ${pin_uart1_rst}
      inverted: ${uart1_rst_inverted}
    rts_pin:
      number: ${pin_uart1_flash}
      inverted: ${uart1_flash_inverted}
