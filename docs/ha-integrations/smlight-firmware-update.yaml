# Home Assistant integration snippet — SMLIGHT radio firmware update entity
#
# One-file drop-in for `configuration.yaml` (or as a HA `packages/` entry).
# Ships one update entity per (device, radio) pair by joining:
#
#   1. The ESPHome device's per-radio diagnostic sensors (chip, protocol,
#      role, firmware_channel, uart_baud, installed_firmware).
#   2. SMLIGHT's public firmware catalog fetched via `rest:`.
#
# See docs/design/radio-probe-reference.md §§4, 5, 6i, 7 for the design.
#
# The template maps `chip` → the duplicate-SHA equivalence group of catalog
# ids for that silicon (see docs/radio-firmware/catalog-audit.md). The
# groups are:
#
#   cc2674p10 → {4, 18}       cc1352p7  → {5, 17}
#   cc1352p2  → {0, 16}       efr32mg26 → {13, 21, 68}
#   efr32mg24 → {23, 67}
#
# Entries within a group are byte-identical or serve the same track under
# different SMLIGHT SKU labels, so a device running any id in the group
# should compare against every id in the group. Ids outside these groups
# (SMHUB `.hex` variants like 70, older refreshes like 2/3, signed SMHUB
# tracks like 65/66) are deliberately not iterated — users on those tracks
# see no-op comparisons for now (accepted limitation).
#
# The `availability:` filter suppresses the card when the ESPHome wire
# probe couldn't determine the installed rev ("unknown (…)" values). The
# authoritative chip / protocol / role identity comes from the device's
# `hw_defs/**` YAML (the operator's reflash contract in radio-firmware-
# mgmt.md §6); the practical misconfig detector is a rev that doesn't
# land in the SMLIGHT catalog track this template iterates — the card
# then declines to show an update. See radio-probe-reference.md §6i for
# why the wire-derived chip_probed / role_probed sensors were dropped.
#
# Usage:
#   1. Copy the `rest:` block below into your HA config once. It's device-
#      independent — a single `rest:` sensor caches the catalog for all
#      SMLIGHT devices on your network.
#   2. For each (device, radio) you want an update card for, copy one
#      `- update:` block from the `template:` section and replace the
#      `!DEVICE_SLUG!` markers with your ESPHome device slug (the
#      lowercase name of the device in HA, e.g. `mr4u_r1_73`, `ultima_r1_04`),
#      and `!RADIO!` with `radio_1`, `radio_2`, or `radio_3` as needed.
#   3. See `README.md` in this directory for recorder-exclusion tuning
#      and per-radio v1 coverage caveats.

rest:
  - resource: https://updates.smlight.tech/services/api/slzb-06x-ota.php?type=ZB&format=slzb
    scan_interval: 86400        # once per day
    timeout: 15
    sensor:
      - name: SMLIGHT firmware catalog raw
        unique_id: smlight_fw_catalog_raw
        value_template: "ok"
        json_attributes_path: "$"
        # SMLIGHT chip catalog ids we care about — see radio-probe-reference.md §2.
        json_attributes:
          ["0", "1", "2", "3", "4", "5",
           "12", "13", "16", "17", "18", "21", "23",
           "65", "66", "67", "68", "69", "70", "91"]

template:
  # -------------------------------------------------------------------
  # Copy this block per (device, radio) and edit the placeholder tokens.
  # The body is generic — it iterates the declared chip's duplicate-SHA
  # equivalence group, filters catalog entries by type/baud/channel, and
  # picks the max rev as the "latest available".
  # -------------------------------------------------------------------
  - update:
      - name: "!DEVICE_SLUG! !RADIO! firmware"
        unique_id: "!DEVICE_SLUG!_!RADIO!_firmware_update"

        # Installed version — the ESPHome device's live-probed value.
        # ZNP publishes YYYYMMDD; unimplemented probes publish
        # "unknown (…)" which the availability filter suppresses.
        installed_version: >
          {{ states('sensor.!DEVICE_SLUG!_!RADIO!_installed_firmware') }}

        # Suppress the card when the probe couldn't determine the
        # installed rev. Wire-derived chip / role sensors were removed in
        # v1 (see radio-probe-reference.md §6i); (chip, protocol, role)
        # alignment is the operator's responsibility per
        # radio-firmware-mgmt.md §6 and is enforced end-to-end by whether
        # the installed rev appears in the SMLIGHT catalog track this
        # template iterates.
        availability: >
          {% set inst = states('sensor.!DEVICE_SLUG!_!RADIO!_installed_firmware') %}
          {{ inst not in ('unknown', 'unavailable', 'none')
             and not inst.startswith('unknown (') }}

        # Latest available — iterate the chip's duplicate-SHA group,
        # filter by (type, baud, prod), pick the max rev.
        latest_version: >
          {% set chip_name = states('sensor.!DEVICE_SLUG!_!RADIO!_chip') %}
          {% set chip_to_ids = {
               'cc2674p10': ['4', '18'],
               'cc1352p7':  ['5', '17'],
               'cc1352p2':  ['0', '16'],
               'efr32mg26': ['13', '21', '68'],
               'efr32mg24': ['23', '67'],
             } %}
          {% set ids = chip_to_ids.get(chip_name, []) %}
          {% set role = states('sensor.!DEVICE_SLUG!_!RADIO!_role') %}
          {% set channel = states('sensor.!DEVICE_SLUG!_!RADIO!_firmware_channel') %}
          {% set baud = states('sensor.!DEVICE_SLUG!_!RADIO!_uart_baud') | int(0) %}
          {% set ftype = {'coord': '0', 'router': '1', 'rcp': '2', 'ncp': '2'}[role]
                        if role in ['coord', 'router', 'rcp', 'ncp'] else '' %}
          {% set want_prod = channel == 'prod' %}
          {# Router firmware doesn't speak a host UART protocol — catalog
             entries carry baud: 0 (~57%) or baud: 115200 (~43%). Accept
             both for role=router; exact-match for every other role. #}
          {% set allowed_bauds = [0, baud] if role == 'router' else [baud] %}
          {% set ns = namespace(all=[]) %}
          {% for id in ids %}
            {% set entries = state_attr('sensor.smlight_firmware_catalog_raw', id) or [] %}
            {% set matched = entries
                  | selectattr('type', 'eq', ftype)
                  | selectattr('prod', 'eq', want_prod)
                  | selectattr('baud', 'in', allowed_bauds)
                  | list %}
            {% set ns.all = ns.all + matched %}
          {% endfor %}
          {% if channel == 'custom' or ns.all | length == 0 %}
            {{ states('sensor.!DEVICE_SLUG!_!RADIO!_installed_firmware') }}
          {% else %}
            {{ (ns.all | sort(attribute='rev') | last).rev }}
          {% endif %}

        # release_summary: catalog-fit prefix + selected entry's notes.
        # The prefix surfaces a) "custom channel" (comparison disabled)
        # b) "installed rev not in catalog" (running an unlisted build).
        # Hard chip/role mismatch never reaches here — availability
        # already hid the card.
        release_summary: >
          {% set chip_name = states('sensor.!DEVICE_SLUG!_!RADIO!_chip') %}
          {% set chip_to_ids = {
               'cc2674p10': ['4', '18'],
               'cc1352p7':  ['5', '17'],
               'cc1352p2':  ['0', '16'],
               'efr32mg26': ['13', '21', '68'],
               'efr32mg24': ['23', '67'],
             } %}
          {% set ids = chip_to_ids.get(chip_name, []) %}
          {% set role = states('sensor.!DEVICE_SLUG!_!RADIO!_role') %}
          {% set channel = states('sensor.!DEVICE_SLUG!_!RADIO!_firmware_channel') %}
          {% set baud = states('sensor.!DEVICE_SLUG!_!RADIO!_uart_baud') | int(0) %}
          {% set inst = states('sensor.!DEVICE_SLUG!_!RADIO!_installed_firmware') %}
          {% set ftype = {'coord': '0', 'router': '1', 'rcp': '2', 'ncp': '2'}[role]
                        if role in ['coord', 'router', 'rcp', 'ncp'] else '' %}
          {% set want_prod = channel == 'prod' %}
          {% set allowed_bauds = [0, baud] if role == 'router' else [baud] %}
          {% set ns = namespace(all=[]) %}
          {% for id in ids %}
            {% set entries = state_attr('sensor.smlight_firmware_catalog_raw', id) or [] %}
            {% set matched = entries
                  | selectattr('type', 'eq', ftype)
                  | selectattr('prod', 'eq', want_prod)
                  | selectattr('baud', 'in', allowed_bauds)
                  | list %}
            {% set ns.all = ns.all + matched %}
          {% endfor %}
          {% set installed_in_catalog =
             ns.all | selectattr('rev', 'eq', inst) | list | length > 0 %}
          {% set latest_notes = (ns.all | sort(attribute='rev') | last).notes
                                if ns.all | length > 0 else '' %}
          {% if channel == 'custom' %}
            ℹ️ Custom firmware channel — catalog comparison disabled.
            {{- latest_notes and '\n\n' + latest_notes or '' }}
          {% elif ns.all | length == 0 %}
            ⚠️ No matching catalog entries for chip={{ chip_name }} role={{ role }} baud={{ baud }} channel={{ channel }}.
          {% elif not installed_in_catalog %}
            ⚠️ Installed rev {{ inst }} not found in SMLIGHT catalog for chip={{ chip_name }} — you may be on a custom or withdrawn build.
            {{- '\n\n' + latest_notes if latest_notes else '' }}
          {% else %}
            {{ latest_notes }}
          {% endif %}

        release_url: >
          {% set chip_name = states('sensor.!DEVICE_SLUG!_!RADIO!_chip') %}
          {% set chip_to_ids = {
               'cc2674p10': ['4', '18'],
               'cc1352p7':  ['5', '17'],
               'cc1352p2':  ['0', '16'],
               'efr32mg26': ['13', '21', '68'],
               'efr32mg24': ['23', '67'],
             } %}
          {% set ids = chip_to_ids.get(chip_name, []) %}
          {% set role = states('sensor.!DEVICE_SLUG!_!RADIO!_role') %}
          {% set channel = states('sensor.!DEVICE_SLUG!_!RADIO!_firmware_channel') %}
          {% set baud = states('sensor.!DEVICE_SLUG!_!RADIO!_uart_baud') | int(0) %}
          {% set ftype = {'coord': '0', 'router': '1', 'rcp': '2', 'ncp': '2'}[role]
                        if role in ['coord', 'router', 'rcp', 'ncp'] else '' %}
          {% set want_prod = channel == 'prod' %}
          {% set allowed_bauds = [0, baud] if role == 'router' else [baud] %}
          {% set ns = namespace(all=[]) %}
          {% for id in ids %}
            {% set entries = state_attr('sensor.smlight_firmware_catalog_raw', id) or [] %}
            {% set matched = entries
                  | selectattr('type', 'eq', ftype)
                  | selectattr('prod', 'eq', want_prod)
                  | selectattr('baud', 'in', allowed_bauds)
                  | list %}
            {% set ns.all = ns.all + matched %}
          {% endfor %}
          {{ (ns.all | sort(attribute='rev') | last).link if ns.all | length > 0 else '' }}

        entity_picture: https://smlight.tech/wp-content/uploads/2024/06/logo.png

# Recommended: exclude the raw catalog sensor from recorder — the ~15 KB
# json_attributes payload is fine functionally but pollutes history DB.
#
# recorder:
#   exclude:
#     entities:
#       - sensor.smlight_firmware_catalog_raw
